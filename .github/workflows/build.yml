name: Build World3D APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/world3d

          cat > settings.gradle << 'EOF'
          rootProject.name = "world3d"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'

          android {
              namespace 'com.example.world3d'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.world3d"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }

              buildFeatures {
                  compose true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion "1.5.14"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              packagingOptions {
                  jniLibs {
                      pickFirsts += ["**/libc++_shared.so"]
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.activity:activity-compose:1.9.0'
              implementation 'androidx.compose.ui:ui:1.6.8'
              implementation 'androidx.compose.foundation:foundation:1.6.8'
              implementation 'androidx.compose.material3:material3:1.2.1'

              implementation 'io.github.sceneview:sceneview:2.3.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="World3D"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ===== الطبقة 1: البيانات (WorldObject / WorldState) =====
          cat > app/src/main/java/com/example/world3d/WorldData.kt << 'EOF'
          package com.example.world3d

          import androidx.compose.runtime.mutableStateListOf

          // نوع العنصر بالعالم - نضيف أنواع جديدة هنا مستقبلاً (بيت، صخرة، ماء...)
          enum class ObjectType {
              TREE
          }

          // عنصر واحد بالعالم = بيانات فقط، مو شكل مرسوم مباشرة.
          // هذا يسمح لاحقًا بحفظ العالم كملف، أو تلقي قائمة من ذكاء صناعي (Gemini) وإضافتها هنا مباشرة.
          data class WorldObject(
              val type: ObjectType,
              val x: Float,
              val z: Float,
              val scale: Float = 1f,
              val rotationY: Float = 0f
          )

          // حالة العالم الكاملة - قائمة كل العناصر الموجودة حاليًا
          class WorldState {
              val objects = mutableStateListOf<WorldObject>()

              fun add(obj: WorldObject) {
                  objects.add(obj)
              }

              // نقطة توسعة مستقبلية: تحميل قائمة عناصر دفعة وحدة
              // (مثلاً من ملف محفوظ، أو من رد الذكاء الصناعي بصيغة JSON)
              fun addAll(newObjects: List<WorldObject>) {
                  objects.addAll(newObjects)
              }
          }
          EOF

          # ===== الطبقة 2: مصنع النماذج (يحول بيانات العنصر لشكل ثلاثي أبعاد) =====
          cat > app/src/main/java/com/example/world3d/ModelFactory.kt << 'EOF'
          package com.example.world3d

          import android.graphics.Color as AndroidColor
          import com.google.android.filament.Engine
          import io.github.sceneview.loaders.MaterialLoader
          import io.github.sceneview.math.Position
          import io.github.sceneview.node.CylinderNode
          import io.github.sceneview.node.Node
          import io.github.sceneview.node.SphereNode

          // "مصنع" يبني الشكل ثلاثي الأبعاد المناسب لكل نوع عنصر.
          // الحين يبني أشكال بسيطة بالكود (إجرائي).
          // لاحقًا، نستبدل محتوى كل دالة بتحميل نموذج glTF حقيقي عبر modelLoader
          // بدون ما نغيّر أي كود ثاني بالمشروع - هذا كل هدف وجود هذه الطبقة لحالها.
          object ModelFactory {

              fun buildNodes(
                  worldObject: WorldObject,
                  engine: Engine,
                  materialLoader: MaterialLoader
              ): List<Node> {
                  return when (worldObject.type) {
                      ObjectType.TREE -> buildTree(worldObject, engine, materialLoader)
                  }
              }

              private fun buildTree(
                  obj: WorldObject,
                  engine: Engine,
                  materialLoader: MaterialLoader
              ): List<Node> {
                  val trunkMaterial = materialLoader.createColorInstance(AndroidColor.rgb(90, 60, 30))
                  val canopyMaterialDark = materialLoader.createColorInstance(AndroidColor.rgb(30, 110, 40))
                  val canopyMaterialLight = materialLoader.createColorInstance(AndroidColor.rgb(60, 150, 70))

                  val s = obj.scale

                  // جذع متدرج السُمك: قطعتين، أعرض من تحت
                  val trunkLower = CylinderNode(
                      engine = engine,
                      radius = 0.22f * s,
                      height = 0.9f * s,
                      materialInstance = trunkMaterial
                  ).apply {
                      position = Position(x = obj.x, y = 0.45f * s, z = obj.z)
                  }
                  val trunkUpper = CylinderNode(
                      engine = engine,
                      radius = 0.14f * s,
                      height = 0.7f * s,
                      materialInstance = trunkMaterial
                  ).apply {
                      position = Position(x = obj.x, y = 1.2f * s, z = obj.z)
                  }

                  // قمة متعددة الطبقات (3 كرات بأحجام وارتفاعات مختلفة) بدل كرة وحدة بسيطة
                  val canopyBottom = SphereNode(
                      engine = engine,
                      radius = 0.75f * s,
                      materialInstance = canopyMaterialDark
                  ).apply {
                      position = Position(x = obj.x, y = 1.7f * s, z = obj.z)
                  }
                  val canopyMid = SphereNode(
                      engine = engine,
                      radius = 0.6f * s,
                      materialInstance = canopyMaterialLight
                  ).apply {
                      position = Position(x = obj.x + 0.1f * s, y = 2.15f * s, z = obj.z)
                  }
                  val canopyTop = SphereNode(
                      engine = engine,
                      radius = 0.4f * s,
                      materialInstance = canopyMaterialDark
                  ).apply {
                      position = Position(x = obj.x - 0.05f * s, y = 2.55f * s, z = obj.z)
                  }

                  return listOf(trunkLower, trunkUpper, canopyBottom, canopyMid, canopyTop)
              }
          }
          EOF

          # ===== الطبقة 3 و4: العرض + التفاعل (الشاشة الرئيسية) =====
          cat > app/src/main/java/com/example/world3d/MainActivity.kt << 'EOF'
          package com.example.world3d

          import android.graphics.Color as AndroidColor
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.Column
          import androidx.compose.foundation.layout.Row
          import androidx.compose.foundation.layout.Spacer
          import androidx.compose.foundation.layout.fillMaxSize
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.size
          import androidx.compose.material3.Button
          import androidx.compose.material3.Text
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.setValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.layout.onGloballyPositioned
          import androidx.compose.ui.unit.IntSize
          import androidx.compose.ui.unit.dp
          import io.github.sceneview.Scene
          import io.github.sceneview.math.Position
          import io.github.sceneview.math.Rotation
          import io.github.sceneview.math.Size
          import io.github.sceneview.node.CubeNode
          import io.github.sceneview.node.Node
          import io.github.sceneview.rememberCameraManipulator
          import io.github.sceneview.rememberCameraNode
          import io.github.sceneview.rememberCollisionSystem
          import io.github.sceneview.rememberEngine
          import io.github.sceneview.rememberMainLightNode
          import io.github.sceneview.rememberMaterialLoader
          import io.github.sceneview.rememberNodes
          import io.github.sceneview.rememberOnGestureListener
          import io.github.sceneview.rememberRenderer
          import io.github.sceneview.rememberScene
          import io.github.sceneview.rememberView

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      World3DScreen()
                  }
              }
          }

          private const val GROUND_HALF_SIZE = 8f
          private const val MOVE_STEP = 0.7f

          @androidx.compose.runtime.Composable
          fun World3DScreen() {
              val engine = rememberEngine()
              val view = rememberView(engine)
              val renderer = rememberRenderer(engine)
              val scene = rememberScene(engine)
              val collisionSystem = rememberCollisionSystem(view)
              val materialLoader = rememberMaterialLoader(engine)

              val groundMaterial = remember { materialLoader.createColorInstance(AndroidColor.rgb(90, 140, 70)) }

              // حالة العالم - طبقة البيانات (من WorldData.kt)
              val worldState = remember { WorldState() }

              var camX by remember { mutableStateOf(0f) }
              var camY by remember { mutableStateOf(7f) }
              var camZ by remember { mutableStateOf(11f) }

              val cameraNode = rememberCameraNode(engine) {
                  position = Position(x = camX, y = camY, z = camZ)
                  rotation = Rotation(x = -35f, y = 0f, z = 0f)
              }
              cameraNode.position = Position(x = camX, y = camY, z = camZ)

              val mainLightNode = rememberMainLightNode(engine) {
                  intensity = 110_000f
              }

              var viewSize by remember { mutableStateOf(IntSize.Zero) }

              // طبقة العرض تبني نفسها تلقائيًا من طبقة البيانات عبر مصنع النماذج
              val worldNodes = rememberNodes()

              Box(modifier = Modifier.fillMaxSize()) {
                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .onGloballyPositioned { coordinates -> viewSize = coordinates.size }
                  ) {
                      Scene(
                          modifier = Modifier.fillMaxSize(),
                          engine = engine,
                          view = view,
                          renderer = renderer,
                          scene = scene,
                          collisionSystem = collisionSystem,
                          materialLoader = materialLoader,
                          cameraNode = cameraNode,
                          cameraManipulator = rememberCameraManipulator(),
                          mainLightNode = mainLightNode,
                          childNodes = rememberNodes {
                              add(
                                  CubeNode(
                                      engine = engine,
                                      size = Size(GROUND_HALF_SIZE * 2, 0.1f, GROUND_HALF_SIZE * 2),
                                      materialInstance = groundMaterial
                                  ).apply {
                                      position = Position(x = 0f, y = -0.05f, z = 0f)
                                  }
                              )
                          } + worldNodes,
                          onGestureListener = rememberOnGestureListener(
                              onSingleTapConfirmed = { motionEvent, _ ->
                                  if (viewSize.width > 0 && viewSize.height > 0) {
                                      val normX = (motionEvent.x / viewSize.width) * 2f - 1f
                                      val normZ = (motionEvent.y / viewSize.height) * 2f - 1f
                                      val worldX = normX * GROUND_HALF_SIZE
                                      val worldZ = normZ * GROUND_HALF_SIZE

                                      // التفاعل يضيف "بيانات" فقط
                                      val newObject = WorldObject(
                                          type = ObjectType.TREE,
                                          x = worldX,
                                          z = worldZ,
                                          scale = 0.8f + (0..40).random() / 100f
                                      )
                                      worldState.add(newObject)

                                      // مصنع النماذج يحول البيانات لأشكال ويضيفها للعرض
                                      val nodes: List<Node> = ModelFactory.buildNodes(newObject, engine, materialLoader)
                                      worldNodes.addAll(nodes)
                                  }
                              }
                          )
                      )
                  }

                  Column(
                      modifier = Modifier.align(Alignment.BottomStart).padding(16.dp)
                  ) {
                      Row {
                          Spacer(modifier = Modifier.size(56.dp))
                          Button(onClick = { camZ -= MOVE_STEP }) { Text("↑") }
                          Spacer(modifier = Modifier.size(56.dp))
                      }
                      Row {
                          Button(onClick = { camX -= MOVE_STEP }) { Text("←") }
                          Button(onClick = { camY += MOVE_STEP }) { Text("⤴") }
                          Button(onClick = { camX += MOVE_STEP }) { Text("→") }
                      }
                      Row {
                          Spacer(modifier = Modifier.size(56.dp))
                          Button(onClick = { camZ += MOVE_STEP }) { Text("↓") }
                          Spacer(modifier = Modifier.size(56.dp))
                      }
                      Row {
                          Spacer(modifier = Modifier.size(56.dp))
                          Button(onClick = { camY -= MOVE_STEP }) { Text("⤵") }
                      }
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: world3d-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
